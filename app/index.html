<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cam Test</title>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: #000; color: #ddd;
    font-family: sans-serif; overflow: hidden; }
  .tile { position: absolute; width: 632px; height: 352px; background: #000; overflow: hidden;
    border: 4px solid #000; }
  .tile.focus { border-color: #3a8bff; }
  .tile.full { left: 0 !important; top: 0 !important; width: 1920px; height: 1080px; border: 0; z-index: 5; }
  .tile img, .tile video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
  .tile video { opacity: 0; }
  .tile video.on { opacity: 1; }
  .label { position: absolute; left: 0; bottom: 0; background: rgba(0,0,0,.6); font-size: 20px;
    padding: 3px 10px; color: #fff; }
  .tile.full .label { font-size: 30px; padding: 8px 16px; }
  .badge { position: absolute; right: 0; top: 0; display: none; background: rgba(0,0,0,.6); color: #f55;
    font-weight: bold; font-size: 20px; padding: 3px 10px; }
  .tile.full .badge { font-size: 30px; padding: 8px 16px; }
  #clock { position: absolute; left: 16px; top: 10px; font-size: 28px; font-weight: bold; color: #fff;
    background: rgba(0,0,0,.6); padding: 4px 12px; z-index: 10; }
</style>
</head>
<body>
<div id="clock"></div>
<script src="config.js"></script>
<script>
// Fail visibly instead of silently when the local config was not created.
if (!window.CAMERAS_CONFIG) {
  document.body.innerHTML = "<p style='color:#fff;font-size:36px;padding:80px'>Missing app/config.js: " +
    "copy app/config.example.js to app/config.js, fill in your go2rtc host and cameras, rebuild.</p>";
  throw new Error("missing config.js");
}
var HOST = window.CAMERAS_CONFIG.go2rtcHost;
var BASE = "https://" + HOST + "/api/";
var CAMS = window.CAMERAS_CONFIG.cameras;
var FOCUS_DELAY = 600;
var MSE_CODECS = ["hvc1.1.6.L153.B0", "hev1.1.6.L153.B0", "avc1.640029", "avc1.64002A", "avc1.640033", "avc1.42E01E"];
var supported = [];
for (var c = 0; c < MSE_CODECS.length; c++) {
  if (window.MediaSource && MediaSource.isTypeSupported('video/mp4; codecs="' + MSE_CODECS[c] + '"')) supported.push(MSE_CODECS[c]);
}

function pad(n) { return (n < 10 ? "0" : "") + n; }
function now() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
setInterval(function () { document.getElementById("clock").textContent = now(); }, 250);

function title(cam) { return cam.replace(/_sub$/, "").replace(/_/g, " "); }

// --- snapshot tiles ---------------------------------------------------------
var tiles = [];
for (var i = 0; i < CAMS.length; i++) {
  var el = document.createElement("div");
  el.className = "tile";
  el.style.left = (i % 3) * 640 + "px";
  el.style.top = Math.floor(i / 3) * 360 + "px";
  var img = document.createElement("img");
  var lbl = document.createElement("div");
  lbl.className = "label";
  lbl.textContent = title(CAMS[i]);
  var badge = document.createElement("div");
  badge.className = "badge";
  badge.innerHTML = "&#9679; AO VIVO";
  el.appendChild(img);
  el.appendChild(lbl);
  el.appendChild(badge);
  document.body.appendChild(el);
  tiles.push({cam: CAMS[i], el: el, img: img, lbl: lbl, badge: badge, polling: false, gen: 0, timer: 0, frames: 0});
}

function startPoll(t) {
  if (t.polling) return;
  t.polling = true;
  var gen = ++t.gen;
  function next() {
    if (!t.polling || gen !== t.gen) return;
    t.img.src = BASE + "frame.jpeg?src=" + t.cam + "&t=" + Date.now();
  }
  t.img.onload = function () { if (gen !== t.gen) return; t.frames++; t.timer = setTimeout(next, 0); };
  t.img.onerror = function () { if (gen !== t.gen) return; t.timer = setTimeout(next, 3000); };
  next();
}

function stopPoll(t) {
  t.polling = false;
  t.gen++;
  clearTimeout(t.timer);
}

// --- single live player (the TV decodes one video at a time) ----------------
var live = null;

function stopLive() {
  if (!live) return;
  var l = live;
  live = null;
  if (l.ws) { l.ws.onmessage = null; l.ws.onclose = null; try { l.ws.close(); } catch (e) {} }
  l.video.removeAttribute("src");
  l.video.load();
  if (l.video.parentNode) l.video.parentNode.removeChild(l.video);
  l.tile.badge.style.display = "none";
  if (!fullscreen) startPoll(l.tile);
}

function startLive(t, stream) {
  stopLive();
  var l = {tile: t, stream: stream, state: "carregando", ws: null, sb: null, queue: [], startedAt: Date.now()};
  live = l;
  var v = document.createElement("video");
  v.muted = true;
  v.autoplay = true;
  l.video = v;
  t.el.insertBefore(v, t.lbl);
  v.addEventListener("playing", function () {
    if (live !== l) return;
    l.state = "tocando";
    v.className = "on";
    stopPoll(t);
    t.badge.style.display = "block";
  });
  v.addEventListener("error", function () { if (live === l) l.state = "erro " + (v.error ? v.error.code : "?"); });

  var ms = new MediaSource();
  v.src = URL.createObjectURL(ms);
  v.play();
  function pump() {
    if (!l.sb || l.sb.updating || !l.queue.length) return;
    try { l.sb.appendBuffer(l.queue.shift()); } catch (e) { l.state = "erro append"; }
  }
  ms.addEventListener("sourceopen", function () {
    if (live !== l) return;
    var ws = new WebSocket("wss://" + HOST + "/api/ws?src=" + stream);
    l.ws = ws;
    ws.binaryType = "arraybuffer";
    ws.onopen = function () { ws.send(JSON.stringify({type: "mse", value: supported.join(",")})); };
    ws.onmessage = function (ev) {
      if (live !== l) return;
      if (typeof ev.data === "string") {
        var msg = JSON.parse(ev.data);
        if (msg.type === "mse") {
          try {
            l.sb = ms.addSourceBuffer(msg.value);
            l.sb.mode = "segments";
            l.sb.addEventListener("updateend", pump);
          } catch (e) { l.state = "erro codec"; }
        }
        return;
      }
      l.queue.push(ev.data);
      pump();
      // Trim old data so a long session doesn't grow the buffer forever
      if (l.sb && !l.sb.updating && v.buffered.length && v.currentTime - v.buffered.start(0) > 30) {
        try { l.sb.remove(v.buffered.start(0), v.currentTime - 10); } catch (e) {}
      }
    };
    ws.onerror = function () { if (live === l) l.state = "erro ws"; };
  });
}

// --- focus / fullscreen -----------------------------------------------------
var cur = 0, fullscreen = false, focusTimer = 0;

function setFocus(idx) {
  tiles[cur].el.className = "tile";
  cur = idx;
  tiles[cur].el.className = "tile focus";
  clearTimeout(focusTimer);
  focusTimer = setTimeout(function () { startLive(tiles[cur], tiles[cur].cam); }, FOCUS_DELAY);
}

function enterFull() {
  fullscreen = true;
  clearTimeout(focusTimer);
  for (var i = 0; i < tiles.length; i++) if (i !== cur) stopPoll(tiles[i]);
  tiles[cur].el.className = "tile full";
  startLive(tiles[cur], tiles[cur].cam.replace(/_sub$/, ""));
}

function exitFull() {
  fullscreen = false;
  tiles[cur].el.className = "tile focus";
  for (var i = 0; i < tiles.length; i++) if (i !== cur) startPoll(tiles[i]);
  startLive(tiles[cur], tiles[cur].cam);
}

document.addEventListener("keydown", function (e) {
  var k = e.keyCode;
  if (fullscreen) {
    if (k === 13 || k === 461) { exitFull(); e.preventDefault(); }
    return;
  }
  var col = cur % 3, row = Math.floor(cur / 3);
  if (k === 37) col = (col + 2) % 3;
  else if (k === 39) col = (col + 1) % 3;
  else if (k === 38) row = (row + 2) % 3;
  else if (k === 40) row = (row + 1) % 3;
  else if (k === 13) { enterFull(); return; }
  else return;
  setFocus(row * 3 + col);
});

for (var j = 0; j < tiles.length; j++) startPoll(tiles[j]);
setFocus(0);
</script>
</body>
</html>
